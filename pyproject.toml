[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dass-aos"
version = "0.7.1"
description = "Agent Operating System: stack-agnostic framework and CLI for AI-driven development"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "DASS Team" }
]
keywords = [
    "ai",
    "agents",
    "claude",
    "cursor",
    "gemini",
    "workflow",
    "developer-tools",
    "contracts",
    "architecture"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
scan = ["semgrep", "checkov"]

[project.scripts]
aos = "dass_aos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dass_aos*"]

[tool.setuptools.package-data]
dass_aos = ["templates/**/*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

