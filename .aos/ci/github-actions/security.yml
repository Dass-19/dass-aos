# DASS-AOS · Security pipeline (GitHub Actions)
# Copy to .github/workflows/security.yml in the project.
# Uses the same Semgrep / Checkov skills the agents use.

name: DASS-AOS Security

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          # Equivalent to: aos scan --tool semgrep (real mode, strict in CI)
          semgrep --config auto --config p/security-audit --error --quiet .

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Checkov
        run: pip install checkov
      - name: Checkov scan
        run: |
          # Equivalent to: aos scan --tool checkov
          checkov -d . --quiet --compact || true
          # Remove "|| true" once you want the pipeline to fail on findings
