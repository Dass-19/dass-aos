<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 6" width="880" height="6" role="presentation">
  <defs>
    <style>
      .s0 { animation: glow 4.2s ease-in-out infinite 0.0s; }
      .s1 { animation: glow 4.2s ease-in-out infinite 0.3s; }
      .s2 { animation: glow 4.2s ease-in-out infinite 0.6s; }
      .s3 { animation: glow 4.2s ease-in-out infinite 0.9s; }
      @keyframes glow {
        0%, 100% { opacity: 0.68; }
        25%      { opacity: 1.00; }
        55%      { opacity: 0.68; }
      }
      @media (prefers-reduced-motion: reduce) { .s0,.s1,.s2,.s3 { animation: none; } }
    </style>
  </defs>
  <polygon class="s0" points="4,0 218,0 213,6 0,6" fill="#b89146"/>
  <polygon class="s1" points="223,0 438,0 433,6 218,6" fill="#537195"/>
  <polygon class="s2" points="443,0 658,0 653,6 438,6" fill="#844747"/>
  <polygon class="s3" points="663,0 880,0 875,6 658,6" fill="#5b635d"/>
</svg>
